
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: smart-bus-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: smart-bus-backend
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ES_HOST: http://elasticsearch:9200
      ES_INDEX: bus_waypoints
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./bus_routes.json:/app/bus_routes.json:ro
      - ./bus_stops.json:/app/bus_stops.json:ro

  simulator:
    build: ./simulator
    container_name: smart-bus-simulator
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      CSV_PATH: /app/data/processed/bus_gps_clean.csv
      BATCH_SIZE: "200"
      SEND_INTERVAL: "2"
      LOOP: "true"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    profiles:
      - simulate

  ui:
    build: ./ui
    container_name: smart-bus-ui
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"

  benchmark:
    build:
      context: .
      dockerfile: benchmark/Dockerfile
    container_name: smart-bus-benchmark
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ES_HOST: http://elasticsearch:9200
    profiles:
      - benchmark

volumes:
  es-data:

services:
  # ── Message Broker ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: smart-bus-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: smart-bus-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Storage & Search ───────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: smart-bus-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Visualization ──────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: smart-bus-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro

  # ── Index Initializer (runs once, must finish before Logstash) ──
  init-index:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart-bus-init-index
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ES_HOST: http://elasticsearch:9200
      ES_INDEX: bus_waypoints
    volumes:
      - ./scripts:/app/scripts:ro
    command: python scripts/create_index.py
    restart: "no"

  # ── ETL: Kafka → Elasticsearch ─────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: smart-bus-logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      init-index:
        condition: service_completed_successfully
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart-bus-backend
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ES_HOST: http://elasticsearch:9200
    volumes:
      - ./backend:/app/backend
      - ./requirements.txt:/app/requirements.txt:ro
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Frontend UI ────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: smart-bus-ui
    depends_on:
      - backend
    ports:
      - "8501:8501"
    environment:
      API_BASE: http://backend:8000
    volumes:
      - ./ui:/app/ui
      - ./requirements.txt:/app/requirements.txt:ro
    command: streamlit run /app/ui/smartsearchbus_web.py --server.address 0.0.0.0 --server.runOnSave true

  # ── Simulator (Data Producer) ──────────────────────────────
  simulator:
    build: ./simulator
    container_name: smart-bus-simulator
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - ./.env
    volumes:
      - ./data:/app/data:ro
    profiles:
      - simulate

volumes:
  es-data:

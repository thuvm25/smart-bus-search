# ─────────────────────────────────────────────────────────────────────────────
# Logstash Pipeline: Kafka → Elasticsearch
#
# Input : Kafka topic "bus-gps-raw"
#         Each message is a JSON object produced by simulate_gps.py:
#           vehicle, datetime (ISO8601), lat, lon, location{lat,lon},
#           speed, ignition, aircon, working, driver,
#           route_id, route_no, route_name  (route fields when available)
#
# Filter: parse datetime → @timestamp, cast numeric fields, build geo_point
# Output: Elasticsearch index "bus_waypoints"
# ─────────────────────────────────────────────────────────────────────────────

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["bus-gps-raw"]
    group_id          => "logstash-bus-gps"
    codec             => "json"
    auto_offset_reset => "earliest"
    decorate_events   => "basic"
  }
}

filter {
  # ── Timestamp ──────────────────────────────────────────────────────────────
  # Promote the record's datetime to Logstash @timestamp so Kibana
  # time-based queries reflect the original event time, not ingest time.
  date {
    match   => ["datetime", "ISO8601",
                "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ",
                "yyyy-MM-dd HH:mm:ss"]
    target   => "@timestamp"
    timezone => "UTC"
  }

  # ── Numeric type coercion ──────────────────────────────────────────────────
  mutate {
    convert => {
      "lat"     => "float"
      "lon"     => "float"
      "speed"   => "float"
      "heading" => "float"
    }
  }

  # ── Geo-point ──────────────────────────────────────────────────────────────
  # The simulator already sends location:{lat,lon}. This block is a safety net
  # for records that arrive without it (e.g., legacy CSV-mode messages).
  if ![location] {
    mutate {
      add_field => {
        "[location][lat]" => "%{lat}"
        "[location][lon]" => "%{lon}"
      }
    }
    mutate {
      convert => {
        "[location][lat]" => "float"
        "[location][lon]" => "float"
      }
    }
  }

  # ── Cleanup ────────────────────────────────────────────────────────────────
  # Remove Logstash/Kafka internal metadata that has no value in ES.
  mutate {
    remove_field => ["@version", "event"]
  }
}

output {
  elasticsearch {
    hosts  => ["http://elasticsearch:9200"]
    index  => "bus_waypoints"
    action => "index"
  }

  # Uncomment to print a dot per batch to stdout for live progress monitoring:
  # stdout { codec => dots }
}
